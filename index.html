<script>
const MATERI = [
 {j:"Apa Itu DHCP", eyebrow:"Halaman 1 dari 6", html:`
  <p><b>DHCP</b> (<i>Dynamic Host Configuration Protocol</i>) memberi konfigurasi jaringan secara otomatis kepada setiap perangkat yang terhubung, tanpa diisi manual.</p>
  <h3>Yang diberikan DHCP</h3>
  <ul>
   <li><b>IP address</b> — alamat unik perangkat</li>
   <li><b>Subnet mask</b> — penanda batas jaringan</li>
   <li><b>Default gateway</b> — pintu keluar ke jaringan lain</li>
   <li><b>DNS server</b> — penerjemah nama domain ke IP</li>
  </ul>
  <h3>Dua peran</h3>
  <div class="scroll"><table>
   <tr><th>Peran</th><th>Tugas</th><th>Contoh</th></tr>
   <tr><td><b>Server</b></td><td>Membagikan IP</td><td>MikroTik, router Cisco</td></tr>
   <tr><td><b>Client</b></td><td>Menerima IP</td><td>Laptop, HP, PC siswa</td></tr>
  </table></div>
  <p>DHCP memakai UDP. Server mendengarkan di <code>port 67</code>, client mengirim dari <code>port 68</code>.</p>
  <div class="note"><b>Catat:</b> DHCP tidak membuat koneksi lebih cepat. Fungsinya mempermudah pengelolaan alamat dan mencegah IP bentrok.</div>
  <p>Perangkat yang alamatnya harus tetap, seperti server, printer, dan CCTV, justru diberi IP statis agar mudah ditemukan.</p>`,
  kuis:{t:"Apa akibat dua komputer diberi IP sama secara manual?",o:["Keduanya bermasalah","Jaringan jadi cepat","Otomatis diperbaiki","Keduanya aman"],b:0}},

 {j:"Proses DORA", eyebrow:"Halaman 2 dari 6", html:`
  <p>Perangkat baru mendapatkan IP lewat empat langkah yang disingkat <b>DORA</b>.</p>
  <div class="scroll"><table>
   <tr><th>Tahap</th><th>Pengirim</th><th>Isi pesan</th></tr>
   <tr><td><b>D</b>iscover</td><td>Client</td><td>Mencari DHCP server</td></tr>
   <tr><td><b>O</b>ffer</td><td>Server</td><td>Menawarkan satu IP kosong</td></tr>
   <tr><td><b>R</b>equest</td><td>Client</td><td>Meminta IP yang ditawarkan</td></tr>
   <tr><td><b>A</b>cknowledge</td><td>Server</td><td>Mengunci IP dan memberi lease</td></tr>
  </table></div>
  <p>Karena client belum punya alamat, Discover dikirim <i>broadcast</i> ke <code>255.255.255.255</code>.</p>
  <h3>Lease time</h3>
  <p>IP dari DHCP bersifat pinjaman. Masa pinjamnya disebut <b>lease time</b>. Di tengah masa pinjam, client otomatis meminta perpanjangan. Bila server tidak menjawab sampai habis, client mengulang dari Discover.</p>
  <div class="note"><b>Catat:</b> urutan DORA tidak boleh tertukar. Discover, Offer, Request, Acknowledge.</div>`,
  kuis:{t:"Pesan pertama dari client saat mencari server adalah...",o:["Request","Offer","Discover","Acknowledge"],b:2}},

 {j:"Istilah Penting", eyebrow:"Halaman 3 dari 6", html:`
  <p>Nama menu berbeda antara MikroTik dan Cisco, tetapi maksudnya sama.</p>
  <div class="scroll"><table>
   <tr><th>Istilah</th><th>Arti</th><th>MikroTik</th><th>Cisco</th></tr>
   <tr><td><b>Pool</b></td><td>IP yang dibagikan</td><td>Address Pool</td><td>ip dhcp pool</td></tr>
   <tr><td><b>Excluded</b></td><td>IP yang tidak dibagikan</td><td>di luar range</td><td>excluded-address</td></tr>
   <tr><td><b>Gateway</b></td><td>Pintu keluar</td><td>Gateway for DHCP</td><td>default-router</td></tr>
   <tr><td><b>Lease</b></td><td>Masa pinjam IP</td><td>Lease Time</td><td>lease</td></tr>
   <tr><td><b>Reservasi</b></td><td>IP tetap satu perangkat</td><td>Make Static</td><td>manual binding</td></tr>
  </table></div>
  <p>Pada jaringan <code>192.168.10.0/24</code>, alamat <code>.1</code> sampai <code>.10</code> biasanya dicadangkan untuk router dan server, sisanya baru dibagikan.</p>
  <h3>DHCP Relay</h3>
  <p>Broadcast tidak melewati router, jadi satu server hanya melayani satu jaringan lokal. <b>DHCP Relay</b> meneruskan permintaan client ke server di jaringan lain.</p>
  <div class="note"><b>Catat:</b> jika client malah mendapat <code>169.254.x.x</code>, artinya permintaan DHCP tidak terjawab. Alamat itu dibuat sendiri oleh Windows.</div>`,
  kuis:{t:"Alamat 169.254.x.x pada client menandakan bahwa...",o:["IP berhasil didapat","DHCP tidak menjawab","Server sedang penuh","Kabel sudah benar"],b:1}},

 {j:"DHCP di Winbox", eyebrow:"Halaman 4 dari 6", html:`
  <p><b>Winbox</b> adalah aplikasi pengatur MikroTik. Login bisa lewat MAC address meski router belum punya IP.</p>
  <h3>Syarat awal</h3>
  <p>Interface yang melayani client wajib sudah punya IP. Atur di <code>IP &gt; Addresses</code>, misalnya <code>192.168.10.1/24</code> pada <code>ether2</code>.</p>
  <h3>Langkah DHCP Setup</h3>
  <p>Buka <code>IP &gt; DHCP Server</code>, klik <b>DHCP Setup</b>, lalu isi berurutan:</p>
  <div class="scroll"><table>
   <tr><th>Isian</th><th>Contoh</th></tr>
   <tr><td>DHCP Server Interface</td><td>ether2</td></tr>
   <tr><td>DHCP Address Space</td><td>192.168.10.0/24</td></tr>
   <tr><td>Gateway for DHCP Network</td><td>192.168.10.1</td></tr>
   <tr><td>Addresses to Give Out</td><td>192.168.10.11-192.168.10.254</td></tr>
   <tr><td>DNS Servers</td><td>8.8.8.8</td></tr>
   <tr><td>Lease Time</td><td>12:00:00</td></tr>

  <div class="note"><b>Perhatian:</b> alamat gateway jangan masuk rentang <i>Addresses to Give Out</i>, supaya IP router tidak terpakai client.</div>
  <h3>Memeriksa hasil</h3>
  <p>Tab <b>Leases</b> menampilkan IP, MAC, dan nama perangkat client. Status <code>bound</code> berarti IP sedang dipakai. Tombol <b>Make Static</b> membuat perangkat itu selalu menerima IP yang sama.</p>
  <p>Menu <code>IP &gt; DHCP Client</code> fungsinya kebalikan, yaitu saat router menerima IP dari modem ISP.</p>`,
  kuis:{t:"Sebelum DHCP Setup dijalankan, interface wajib sudah punya...",o:["IP address","Kabel fiber","Nama khusus","Password baru"],b:0}},

 {j:"DHCP di Packet Tracer", eyebrow:"Halaman 5 dari 6", html:`
  <h3>Cara 1: lewat router</h3>
  <p>Buka Router, pilih tab <b>CLI</b>, lalu ketik:</p>
<pre><b>Router(config)#</b> interface gigabitEthernet 0/0
<b>Router(config-if)#</b> ip address 192.168.10.1 255.255.255.0
<b>Router(config-if)#</b> no shutdown
<b>Router(config-if)#</b> exit
<b>Router(config)#</b> ip dhcp excluded-address 192.168.10.1 192.168.10.10

<b>Router(dhcp-config)#</b> default-router 192.168.10.1
<b>Router(dhcp-config)#</b> dns-server 8.8.8.8
<b>Router(dhcp-config)#</b> end</pre>
  <p>Tanpa <code>no shutdown</code>, interface tetap mati dan client tidak akan menerima IP.</p>
  <h3>Cara 2: lewat Server-PT</h3>
  <ol>
   <li><b>Desktop &gt; IP Configuration</b>, isi IP statis <code>192.168.10.1</code>.</li>
   <li><b>Services &gt; DHCP</b>, isi Default Gateway, DNS Server, dan Start IP Address.</li>
   <li>Ubah Service menjadi <b>On</b>, lalu <b>Save</b>.</li>

  <h3>Mengatur dan menguji client</h3>
  <p>Pada PC, buka <b>Desktop &gt; IP Configuration</b> lalu pilih <b>DHCP</b>. Uji lewat Command Prompt:</p>
<pre><b>PC&gt;</b> ipconfig /all
<b>PC&gt;</b> ipconfig /release
<b>PC&gt;</b> ipconfig /renew</pre>

  kuis:{t:"Perintah melihat daftar IP yang dibagikan router adalah...",o:["show running-config","show ip dhcp binding","show ip interface","show dhcp pool"],b:1}},

 {j:"Tugas Praktik", eyebrow:"Halaman 6 dari 6", tugas:true, html:`

const KODE_GURU = "ASJ2026";
const LS = "asj-dhcp-v1";
/* Tempel URL Web App Google Apps Script di antara tanda kutip berikut. */
const API = "";
let db=null, idx=0, baca=false, kuisOk=false, mulaiHal=0, siswa=null, tugasTerkirim=false, mode="lokal";

const app=document.getElementById("app"), bar=document.getElementById("bar"), foot=document.getElementById("foot");
const btnNext=document.getElementById("btnNext"), btnBack=document.getElementById("btnBack");
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"siswa";
const jam=iso=>{try{return new Date(iso).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return "-"}};
const esc=s=>String(s).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

function localAll(){try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return {}}}
function localSave(o){try{const a=localAll();a[o.id]=o;localStorage.setItem(LS,JSON.stringify(a))}catch(e){}}
async function apiKirim(s){
  if(!API) return false;
  try{ const r=await fetch(API,{method:"POST",body:JSON.stringify(s)}); const j=await r.json(); return !!(j&&j.ok) }
  catch(e){ return false }
}
async function apiAmbil(id){
  if(!API) return null;
  try{ const r=await fetch(API+"?aksi=ambil&id="+encodeURIComponent(id)); const j=await r.json(); return (j&&j.data)||null }
  catch(e){ return null }
}
async function apiDaftar(){
  if(!API) return null;
  try{ const r=await fetch(API+"?aksi=daftar"); const j=await r.json(); return (j&&j.data)||null }
  catch(e){ return null }
}
async function simpan(){
  if(!siswa) return;
  siswa.terakhir=new Date().toISOString();
  localSave(siswa);
  if(API){ await apiKirim(siswa); return }
  if(db){try{await db.doc("progres/"+siswa.id).set(siswa)}catch(e){}}
}
async function semuaProgres(){
  if(API){ const d=await apiDaftar(); if(d) return d }
  if(db){try{const s=await db.collection("progres").get();return s.docs.map(d=>d.data())}catch(e){}}
  return Object.values(localAll());
}

           <path d="M13 8.2V13M13 13 6.4 17.4M13 13l6.6 4.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
         </svg>
         PJJ ASJ
       </div>
       <h1 id="judulAwal">Halo, siswa XI TKJ!</h1>
       <p class="tag">Belajar Administrasi Sistem Jaringan dari rumah. Bab II A — Mengenal DHCP, enam halaman materi dan satu tugas praktik.</p>
       <p class="sekolah">SMK Asy-Syahida Dukupuntang · Teknik Komputer dan Jaringan</p>
     </section>
     <section class="form-side">
       <h2>Masuk kelas</h2>
       <p class="lead">Isi namamu untuk mulai atau melanjutkan materi.</p>
       <label class="field"><span>Nama lengkap</span><input id="inNama" autocomplete="name" placeholder="Tulis nama lengkapmu"></label>
       <label class="field"><span>Nomor absen</span><input id="inAbsen" inputmode="numeric" placeholder="Contoh: 7"></label>
       <button class="btn" id="btnMulai" type="button">Mulai belajar</button>
       <p class="hint" id="hintMasuk">Pakai nama yang sama setiap kali masuk agar progresmu tersambung.</p>
     </section>
   </div>`;
  document.getElementById("btnMulai").onclick=async()=>{
    const n=document.getElementById("inNama").value.trim(), a=document.getElementById("inAbsen").value.trim();
    if(n.length<3){document.getElementById("hintMasuk").textContent="Nama belum diisi dengan lengkap.";return}
    const id=slug(n);
    let lama=localAll()[id];
    if(API){ const jauh=await apiAmbil(id); if(jauh) lama=jauh; }
    else if(db){try{const d=await db.doc("progres/"+id).get(); if(d.exists) lama=d.data()}catch(e){}}
    siswa=lama||{id,nama:n,absen:a,hal:0,selesai:[],durasi:{},mulai:new Date().toISOString(),terakhir:null,tugas:null};
    siswa.nama=n; if(a) siswa.absen=a;
    idx=Math.min(siswa.hal||0, MATERI.length-1);
    tugasTerkirim=!!siswa.tugas;
    await simpan(); render();
  };
  pasangPintuRahasia(document.getElementById("judulAwal"));
}

/* ---------- halaman materi ---------- */
const WAKTU=[45,45,45,60,60,30];
let timerId=null, sisa=0;

function mulaiTimer(){
  clearInterval(timerId);
  sisa=WAKTU[idx]||45;
  const label = MATERI[idx].tugas ? "Selesai" : "Lanjut";
  btnNext.disabled=true;
  btnNext.textContent=label+" ("+sisa+")";
  timerId=setInterval(()=>{
    sisa--;
    if(sisa<=0){ clearInterval(timerId); btnNext.textContent=label; btnNext.disabled=false; }
    else btnNext.textContent=label+" ("+sisa+")";
  },1000);
}

function render(){
  bar.hidden=false; foot.hidden=false;
  const m=MATERI[idx]; baca=true; kuisOk=true; mulaiHal=Date.now();
  document.getElementById("barTitle").textContent=m.j;
  document.getElementById("barCount").textContent=(idx+1)+" / "+MATERI.length;
  document.getElementById("trackFill").style.width=Math.round((siswa.selesai.length/MATERI.length)*100)+"%";
  document.getElementById("dots").innerHTML=MATERI.map((_,i)=>
    `<s class="${siswa.selesai.includes(i)?"done":""} ${i===idx?"now":""}"></s>`).join("");
  app.innerHTML=`<p class="eyebrow" style="margin-top:22px">${m.eyebrow}</p><h1>${m.j}</h1>${m.html}<div id="gerbang"></div>`;
  gambarGerbang();
  btnBack.disabled = idx===0;
  mulaiTimer();
  window.scrollTo(0,0);
}

function gambarGerbang(){
  const m=MATERI[idx], g=document.getElementById("gerbang");
  if(m.tugas){
    g.innerHTML=`<div class="gate open">
      <label class="field"><span>Jawaban tugas (tulis nomor soal lalu jawabannya)</span>
        <textarea id="jwb" placeholder="1. ...">${siswa.tugas?esc(siswa.tugas.isi):""}</textarea></label>
      <button class="btn" id="kirimTugas" type="button">Kirim tugas</button>
      <p class="fb ok" id="fbTugas" ${tugasTerkirim?"":"hidden"}>Terkirim pada ${siswa.tugas?jam(siswa.tugas.waktu):""}.</p>
    </div>`;
    const kt=document.getElementById("kirimTugas");
    if(kt) kt.onclick=async()=>{
      const isi=document.getElementById("jwb").value.trim();
      if(isi.length<20){document.getElementById("jwb").focus();return}
      siswa.tugas={isi,waktu:new Date().toISOString()}; tugasTerkirim=true;
      if(!siswa.selesai.includes(idx)) siswa.selesai.push(idx);
      await simpan();
      const f=document.getElementById("fbTugas"); f.hidden=false; f.textContent="Terkirim pada "+jam(siswa.tugas.waktu)+".";
    };
    return;
  }
  const k=m.kuis;
  g.innerHTML=`<div class="gate open">
    <p class="eyebrow" style="color:var(--teal)">Cek pemahaman</p>
    <h2 style="font-size:17px">${k.t}</h2>
    <div style="margin-top:12px">${k.o.map((t,i)=>
      `<label class="opt"><input type="radio" name="q" value="${i}"><span>${t}</span></label>`).join("")}</div>
    <p class="fb" id="fbKuis" hidden></p>
  </div>`;
  document.querySelectorAll('input[name="q"]').forEach(r=>r.onchange=()=>{
    document.querySelectorAll(".opt").forEach(o=>o.classList.remove("pick"));
    r.closest(".opt").classList.add("pick");
    const fb=document.getElementById("fbKuis"); fb.hidden=false;
    if(+r.value===k.b){
      fb.className="fb ok"; fb.textContent="Benar.";
      if(!siswa.kuis) siswa.kuis={};
      siswa.kuis[idx]=true; simpan();
      document.querySelectorAll('input[name="q"]').forEach(x=>x.disabled=true);
    }else{
      fb.className="fb no"; fb.textContent="Belum tepat. Baca kembali bagian terkait, lalu pilih lagi.";
    }
  });
}

btnBack.onclick=()=>{ if(idx>0){idx--; render();} };
btnNext.onclick=async()=>{
  clearInterval(timerId);
  siswa.durasi[idx]=(siswa.durasi[idx]||0)+Math.round((Date.now()-mulaiHal)/1000);
  if(!siswa.selesai.includes(idx)) siswa.selesai.push(idx);
  siswa.hal=Math.max(siswa.hal||0, Math.min(idx+1, MATERI.length-1));
  await simpan();
  if(idx < MATERI.length-1){ idx++; render(); } else layarSelesai();
};

function layarSelesai(){
  clearInterval(timerId); foot.hidden=true;
  const total=Object.values(siswa.durasi).reduce((a,b)=>a+b,0);
  app.innerHTML=`<p class="eyebrow" style="margin-top:26px">Selesai</p>
   <h1>Terima kasih, ${esc(siswa.nama.split(" ")[0])}</h1>
   <div class="card">
     <div class="rowline"><span>Halaman diselesaikan</span><b>${siswa.selesai.length} dari ${MATERI.length}</b></div>
     <div class="rowline"><span>Total waktu belajar</span><b>${Math.round(total/60)} menit</b></div>
     <div class="rowline" style="border:0"><span>Status tugas</span>${tugasTerkirim?'<span class="pill done">Terkirim</span>':'<span class="pill warn">Belum</span>'}</div>
   </div>
   <button class="btn ghost" id="ulang" type="button">Baca ulang materi</button>`;
  document.getElementById("ulang").onclick=()=>{idx=0;render()};
}

/* ---------- pintu rahasia panel guru ---------- */
let ketuk=0, ketukWaktu=0;
function pasangPintuRahasia(el){
  if(!el) return;
  el.onclick=()=>{
    const t=Date.now();
    ketuk = (t-ketukWaktu < 1200) ? ketuk+1 : 1;
    ketukWaktu=t;
    if(ketuk>=5){ ketuk=0; layarKodeGuru(); }
  };
}
function cekHash(){ if((location.hash||"").toLowerCase()==="#guru") layarKodeGuru(); }
window.addEventListener("hashchange",cekHash);

function layarKodeGuru(){
  clearInterval(timerId); bar.hidden=true; foot.hidden=true;
  app.innerHTML=`<h1 style="margin-top:26px">Panel pantauan</h1>
   <div class="card">
     <label class="field"><span>Kode akses</span><input id="kode" type="password" autocomplete="off"></label>
     <button class="btn" id="masukGuru" type="button">Buka</button>
     <p class="hint" id="hintKode"></p>
   </div>
   <p class="center"><button class="linkish" id="kembaliSiswa" type="button">Kembali</button></p>`;
  document.getElementById("masukGuru").onclick=()=>{
    if(document.getElementById("kode").value.trim().toUpperCase()===KODE_GURU) panelGuru();
    else document.getElementById("hintKode").textContent="Kode belum benar.";
  };
  document.getElementById("kembaliSiswa").onclick=()=>{location.hash="";layarMasuk()};
}

async function panelGuru(){
  app.innerHTML=`<h1 style="margin-top:26px">Pantauan Bab II A</h1><p class="meta">Memuat data…</p>`;
  const data=(await semuaProgres()).sort((a,b)=>(+a.absen||99)-(+b.absen||99));
  const sudah=data.filter(d=>(d.selesai||[]).length>0).length;
  const tugas=data.filter(d=>d.tugas).length;
  app.innerHTML=`<h1 style="margin-top:26px">Pantauan Bab II A</h1>
   <div class="card">
     <div class="rowline"><span>Siswa sudah masuk</span><b>${data.length}</b></div>
     <div class="rowline"><span>Sedang atau sudah membaca</span><b>${sudah}</b></div>
     <div class="rowline" style="border:0"><span>Tugas terkirim</span><b>${tugas}</b></div>
   </div>
   ${data.length===0?`<div class="card center"><p class="meta" style="margin:0">Belum ada siswa yang membuka modul ini.</p></div>`:
   `<div class="card">${data.map(d=>{
      const n=(d.selesai||[]).length, persen=Math.round(n/MATERI.length*100);
      const menit=Math.round(Object.values(d.durasi||{}).reduce((a,b)=>a+b,0)/60);
      const cepat = n>0 && menit < n;
      return `<div class="rowline">
        <div style="min-width:0">
          <b>${esc(d.nama)}</b> <span class="meta">· absen ${esc(d.absen||"-")}</span>
          <div class="meta">Halaman ${n} dari ${MATERI.length} · kuis benar ${Object.keys(d.kuis||{}).length}/5 · ${menit} menit · ${d.terakhir?jam(d.terakhir):"-"}</div>
          <div class="mini"><i style="width:${persen}%"></i></div>
        </div>
        <div style="text-align:right;flex:none">
          ${d.tugas?'<span class="pill done">Tugas</span>':(cepat?'<span class="pill warn">Terlalu cepat</span>':`<span class="pill">${persen}%</span>`)}
        </div></div>`}).join("")}</div>`}
   <div class="card"><p class="eyebrow" style="color:var(--teal)">Jawaban tugas</p>
     ${data.filter(d=>d.tugas).map(d=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">
        <b>${esc(d.nama)}</b> <span class="meta">· ${jam(d.tugas.waktu)}</span>
        <p class="meta" style="white-space:pre-wrap;margin:6px 0 0">${esc(d.tugas.isi)}</p></div>`).join("")
       ||'<p class="meta" style="margin:0">Belum ada tugas yang masuk.</p>'}
   </div>
   <p class="center"><button class="linkish" id="segarkan" type="button">Muat ulang</button>
   <button class="linkish" id="keluarGuru" type="button">Keluar</button></p>`;
  document.getElementById("segarkan").onclick=panelGuru;
  document.getElementById("keluarGuru").onclick=()=>{location.hash="";layarMasuk()};
}

/* ---------- mulai ---------- */
(async()=>{
  layarMasuk();
  try{
    db = await claude.use("db");
    if(db) mode="terpusat";
  }catch(e){}
  cekHash();
})();
</script>
